<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>준서의 로벅스 통장 💰</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;font-family:'Apple SD Gothic Neo','Segoe UI',sans-serif;color:#fff}
button,input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.35)}
#header{background:rgba(255,255,255,0.07);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.1);padding:20px}
.header-inner{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto}
.header-title{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.header-sub{font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px}
.total-box{background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:14px;padding:10px 16px;text-align:right;box-shadow:0 4px 20px rgba(255,200,0,0.35)}
.total-label{font-size:10px;color:rgba(0,0,0,0.6);font-weight:700;text-transform:uppercase}
.total-amount{font-size:24px;font-weight:900;color:#1a0a00;line-height:1.1}
.r-icon{font-size:14px;font-weight:700;margin-right:2px;opacity:0.7}
#flash{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border-radius:40px;padding:12px 24px;z-index:999;box-shadow:0 8px 32px rgba(56,239,125,0.4);font-size:15px;font-weight:600;white-space:nowrap;display:none}
.tabs{display:flex;max-width:520px;margin:0 auto;padding:12px 20px 0;gap:8px}
.tab-btn{flex:1;padding:10px 0;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.55);font-weight:600;font-size:13px;cursor:pointer}
.tab-btn.active{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3)}
.content{max-width:520px;margin:0 auto;padding:16px 20px 40px}
.section-title{font-size:13px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.preset-btn{background:rgba(255,255,255,0.06);border:2px solid;border-radius:14px;padding:14px 10px;cursor:pointer;text-align:center;color:#fff}
.preset-btn:active{opacity:0.7}
.p-emoji{font-size:26px;margin-bottom:4px}
.p-label{font-size:13px;font-weight:700;margin-bottom:3px}
.p-rob
